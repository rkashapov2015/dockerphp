services:
  app:
    build:
      dockerfile: ./services/php/Dockerfile
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www/application
    volumes:
      - ./application:/var/www/application
      - ./services/php/config/local.ini:/usr/local/etc/php/conf.d/local.ini
    hostname: app
    networks:
      - app-network
  app_debug:
    build:
      context: ./services/php/debug
      dockerfile: Dockerfile
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_TAGS: dev
    working_dir: /var/www/application
    volumes:
      - ./application:/var/www/application
      - ./services/php/config/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./services/php/config/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
    hostname: app_debug
    networks:
      - app-network
  webserver:
    image: nginx:alpine
    restart: unless-stopped
    tty: true
    ports:
      - "${HOST_PORT:-8000}:80"
    volumes:
      - ./application:/var/www/application
      - ./services/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - app-network
  postgres:
    image: postgres:18.1-alpine
    restart: always
    environment:
      - POSTGRES_DB=application
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '${DB_PORT:-54321}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    hostname: postgres
    networks:
      - app-network
  redis:
    image: redis:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    hostname: redis
    networks:
      - app-network
volumes:
  postgres_data:
  redis_data:
networks:
  app-network:
    driver: bridge
